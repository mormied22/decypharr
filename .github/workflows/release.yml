name: Owned Linkfix Linux acceptance (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-linkfix-baseline
  cancel-in-progress: false

jobs:
  linux-amd64:
    if: github.repository == 'mormied22/decypharr' && github.ref == 'refs/heads/maintenance/linkfix-2.7-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, test and smoke the exact owned baseline locally
        run: bash build/owned-baseline-acceptance.sh
      - name: Preserve acceptance receipts, never an image push
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-linkfix-amd64-${{ github.sha }}
          path: owned-baseline-evidence/
          if-no-files-found: error
          retention-days: 14
